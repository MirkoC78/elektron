<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elektron: riquadri da 360 px</title>
<link rel="stylesheet" href="prove.css">
</head>
<body>
<h1>L'app in riquadri da 360 px, chiaro e scuro affiancati</h1>
<p>Pagina di prova: non fa parte del sito.</p>
<div id="g" class="frames"></div>
<script>
const views = [['Benvenuto', 'onb=0'], ['Percorso', 'demo=12'], ['Lezione', 'demo=20&lesson=20&step=1'], ['Palestra', 'demo=40&view=gym'], ['Teoria', 'demo=40&view=lib'], ['Glossario', 'demo=40&view=words'], ['Profilo', 'demo=40&view=me']];
let h = '';
for (const [v, vl] of views) {
  h += `<h2>${vl}</h2><div class="row">`;
  for (const [t, tl] of [['light', 'chiaro'], ['dark', 'scuro']]) h += `<figure><figcaption>${tl}</figcaption><iframe title="${vl}, tema ${tl}" width="360" height="720" src="../dist/elektron.html?v=${Date.now()}#${v}&theme=${t}"></iframe></figure>`;
  h += '</div>';
}
document.getElementById('g').innerHTML = h;
</script>
</body>
</html>
